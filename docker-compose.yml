services:
  postgres:
    image: postgres:16-alpine
    container_name: cinelock-postgres
    environment:
      POSTGRES_USER: cinelock
      POSTGRES_PASSWORD: cinelock
      POSTGRES_DB: cinelock
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cinelock-redis
    ports:
      - '6379:6379'

volumes:
  postgres-data:

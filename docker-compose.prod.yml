# Stack de PRODUÇÃO — autossuficiente (NÃO empilha com os outros compose).
# Uso na VPS: docker compose -f docker-compose.prod.yml up -d --build
#
# Diferenças pro compose de dev:
#   - Caddy na frente faz HTTPS (Let's Encrypt) e roteia por domínio.
#   - Postgres/Redis/Kafka NÃO publicam portas: só existem na rede interna.
#   - Só o Caddy publica portas (80/443) pra internet.
#   - Segredos (senha do banco, domínios) vêm do arquivo .env, fora do Git.

services:
  # Porteiro: única coisa exposta pra internet. Gera e renova o certificado
  # SSL sozinho e reencaminha cada domínio pro container certo.
  caddy:
    image: caddy:2-alpine
    container_name: cinelock-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # certificados; persistir evita rate limit do Let's Encrypt
      - caddy-config:/config
    depends_on:
      - api
      - front

  # ---- Infra (sem portas publicadas: só acessível pelos outros containers) ----
  postgres:
    image: postgres:16-alpine
    container_name: cinelock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cinelock-redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka em KRaft, config idêntica ao dev — só não publicamos a porta 9092.
  kafka:
    image: apache/kafka:3.7.0
    container_name: cinelock-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 10s
      timeout: 5s
      retries: 15

  # ---- Aplicação ----
  # One-shot: aplica as migrations e sai. API e consumer esperam ele terminar.
  migrate:
    build:
      context: ./back
      target: build
    image: cinelock-back-migrate
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./back
    image: cinelock-back
    container_name: cinelock-api
    command: node dist/src/server.js
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    image: cinelock-back
    container_name: cinelock-consumer
    command: node dist/src/consumer.js
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  front:
    build:
      context: ./front
      args:
        # Em produção o navegador chama a API pelo domínio público (HTTPS).
        VITE_API_URL: ${VITE_API_URL}
    image: cinelock-front
    container_name: cinelock-front
    restart: unless-stopped
    depends_on:
      - api

  # Popula o catálogo. Roda sob demanda (uma vez só):
  #   docker compose -f docker-compose.prod.yml --profile seed run --rm seed
  seed:
    image: cinelock-back
    profiles: ['seed']
    command: node dist/prisma/seed.js
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

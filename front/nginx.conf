server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: qualquer rota (ex.: /demo/concurrency) cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache longo pros assets com hash no nome; o index nunca é cacheado.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
